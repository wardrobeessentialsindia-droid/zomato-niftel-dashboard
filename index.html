<script>
const $=id=>document.getElementById(id),clean=v=>String(v??'').trim(),num=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;const n=Number(clean(v).replace(/,/g,''));return Number.isFinite(n)?n:0},INR=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(num(v)),pct=(a,b)=>b?+(a/b*100).toFixed(2):0,esc=v=>clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),nk=k=>clean(k).toLowerCase().replace(/[^a-z0-9]+/g,''),getv=(r,n)=>{const ks=Object.keys(r);for(const x of n){const k=ks.find(y=>nk(y)===nk(x));if(k!=null)return r[k]}return null};
function dateKey(v){const valid=(y,m,d)=>{const x=new Date(Date.UTC(y,m-1,d));return y>=1900&&y<=2100&&x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d?x.toISOString().slice(0,10):''};if(v instanceof Date&&!isNaN(v))return valid(v.getUTCFullYear(),v.getUTCMonth()+1,v.getUTCDate());if(typeof v==='number'){let s=String(Math.trunc(v));if(/^\d{8}$/.test(s))return valid(+s.slice(0,4),+s.slice(4,6),+s.slice(6));if(v>0&&v<2958466){const d=new Date((v-25569)*86400000);return valid(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}return ''}let s=clean(v);let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return valid(+m[1],+m[2],+m[3]);m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m){let a=+m[1],b=+m[2],y=+m[3];return a>12?valid(y,b,a):b>12?valid(y,a,b):valid(y,b,a)||valid(y,a,b)}m=s.match(/^(\d{4})(\d{2})(\d{2})/);return m?valid(+m[1],+m[2],+m[3]):''}
const ddisp=v=>{const k=dateKey(v),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];if(!k)return '';let [y,mo,d]=k.split('-');return `${d} ${m[+mo-1]} ${y}`};
function rating(v){let s=clean(v).toLowerCase();return['1','2','dsat','detractor'].includes(s)?'DSAT':['4','5','csat','promoter'].includes(s)?'CSAT':['3','neutral','passive'].includes(s)?'Neutral':'Other'}
function rows(ws){return XLSX.utils.sheet_to_json(ws,{defval:null,raw:true}).map(r=>{let x={};Object.keys(r).forEach(k=>x[clean(k)]=r[k]);return x})}function sheet(wb,n){const s=wb.SheetNames.find(x=>clean(x).toLowerCase()===n.toLowerCase());return s?wb.Sheets[s]:null}
function parseCustomer(wb){const raw=sheet(wb,'Raw')||wb.Sheets[wb.SheetNames[0]], em=sheet(wb,'Email Id');const names={};if(em)rows(em).forEach(r=>{let e=clean(getv(r,['agent_email','Agent Email','Agent EMail'])).toLowerCase();if(e)names[e]=clean(getv(r,['Name','name','Agent Name']))});const C=rows(raw).map(r=>{r.agent_email=clean(getv(r,['agent_email','Agent Email','Agent EMail'])).toLowerCase();r.date=dateKey(getv(r,['date','dt','Date']));r.rating_bucket=rating(getv(r,['session_rating','rating','Session Rating']));r.refund_value=num(getv(r,['total_refunded_amount','refund_amount','Refund Amount']));return r}).filter(r=>clean(r.session_id));C.forEach(r=>{if(names[r.agent_email])r.Name=names[r.agent_email]});return{C,names}}
function parseLogin(wb){let L=[];for(const sn of wb.SheetNames){const rr=rows(wb.Sheets[sn]);if(!rr.length)continue;const ks=Object.keys(rr[0]).map(nk);if(!ks.includes('agentemail')||!ks.includes('onlinetime'))continue;rr.forEach(r=>{r.agent_email=clean(getv(r,['Agent Email','Agent EMail','agent_email'])).toLowerCase();r.date=dateKey(getv(r,['Date','date','Slot Date']));r.slot_start=clean(getv(r,['Slot Start Time','slot_start']));r.slot_end=clean(getv(r,['Slot End Time','slot_end']));r['Online Time']=num(getv(r,['Online Time','online_time']));r['Break Time']=num(getv(r,['Break Time','break_time']));r['Chat Resolved']=num(getv(r,['Chat Resolved','chat_resolved']));r['Chat Count']=num(getv(r,['Chat Count','chat_count']));r.unique_key=[r.date,r.agent_email,r.slot_start,r.slot_end].join('|');L.push(r)})}return L}
let DB={customer:[],login:[],agents:{},meta:{expectedLoginHours:8,expectedBreakHours:1},upload:{}};
const IDB='zomato_niftel_v2';function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(IDB,1);q.onupgradeneeded=()=>{const d=q.result;['rawInteractions','workforceSlots','normalizedData','datasets','uploadHistory','processingMetadata'].forEach(x=>{if(!d.objectStoreNames.contains(x))d.createObjectStore(x)});};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function idbSet(store,key,val){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function idbGet(store,key){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,'readonly');const q=t.objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function load(){try{const c=await idbGet('rawInteractions','customer'),l=await idbGet('workforceSlots','login'),a=await idbGet('normalizedData','agents'),m=await idbGet('processingMetadata','meta');DB.customer=c||[];DB.login=l||[];DB.agents=a||{};DB.meta=m||DB.meta;DB.upload=await idbGet('datasets','current')||{};$('status').textContent=DB.customer.length||DB.login.length?'Data Status: Ready':'Data Status: No Dataset'}catch(e){console.warn(e);$('status').textContent='Data Status: Browser storage unavailable'}}
async function persist(){await Promise.all([idbSet('rawInteractions','customer',DB.customer),idbSet('workforceSlots','login',DB.login),idbSet('normalizedData','agents',DB.agents),idbSet('processingMetadata','meta',DB.meta),idbSet('datasets','current',DB.upload)]);$('status').textContent='Data Status: Ready'}
function fileRead(f){return f.arrayBuffer().then(b=>XLSX.read(b,{type:'array',cellDates:false}))}
async function processFiles(files){if(!files.length)return alert('Please select a file.');const cf=files.find(f=>/customer|final|raw/i.test(f.name)),lf=files.find(f=>/login|workforce|daihr/i.test(f.name));let c=[],l=[],a={};for(const f of files){const wb=await fileRead(f);const p=parseCustomer(wb);if(p.C.length){c.push(...p.C);Object.assign(a,p.names)}const pl=parseLogin(wb);if(pl.length)l.push(...pl)}const cm=new Map(DB.customer.map((x,i)=>[clean(x.session_id),i]).filter(x=>x[0]));c.forEach(r=>{const k=clean(r.session_id);if(cm.has(k))DB.customer[cm.get(k)]=r;else{cm.set(k,DB.customer.length);DB.customer.push(r)}});const lm=new Map(DB.login.map((x,i)=>[x.unique_key||[x.date,x.agent_email,x.slot_start,x.slot_end].join('|'),i]));l.forEach(r=>{const k=r.unique_key;if(lm.has(k))DB.login[lm.get(k)]=r;else{lm.set(k,DB.login.length);DB.login.push(r)}});Object.assign(DB.agents,a);DB.upload={datasetId:'ds_'+Date.now(),fileNames:files.map(x=>x.name),uploadedAt:new Date().toISOString(),rowCount:DB.customer.length,loginRows:DB.login.length,dateRange:[...new Set(DB.customer.map(x=>x.date).filter(Boolean))].sort()};await persist();await idbSet('uploadHistory',DB.upload.datasetId,DB.upload);render();$('uploadMsg').textContent=`Dataset saved • ${DB.customer.length.toLocaleString()} interaction rows • ${DB.login.length.toLocaleString()} workforce rows`}
function filters(){return JSON.parse(sessionStorage.getItem('znFilters')||'{}')}function setFilters(x){sessionStorage.setItem('znFilters',JSON.stringify(x))}function options(){const f=filters(),dates=[...new Set(DB.customer.map(x=>x.date).filter(Boolean))].sort(),nodes=[...new Set(DB.customer.map(x=>clean(x.node)).filter(Boolean))].sort(),agents=[...new Set(DB.customer.map(x=>clean(x.agent_email)).filter(Boolean))].sort(),vendors=[...new Set(DB.customer.map(x=>clean(x.vendor||x.vendor_name||x['Vendor Name']||'')).filter(Boolean))].sort();return{f,dates,nodes,agents,vendors}}
function toolbar(){const o=options(),f=o.f;return `<div class="toolbar"><b>Filters</b><select id="fDate"><option value="">All Dates</option>${o.dates.map(x=>`<option ${f.date===x?'selected':''} value="${x}">${ddisp(x)}</option>`).join('')}</select><select id="fNode"><option value="">All Nodes</option>${o.nodes.map(x=>`<option ${f.node===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select id="fAgent"><option value="">All Agents</option>${o.agents.map(x=>`<option ${f.agent===x?'selected':''} value="${esc(x)}">${esc(DB.agents[x]||x)}</option>`).join('')}</select><select id="fVendor"><option value="">All Vendors</option>${o.vendors.map(x=>`<option ${f.vendor===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="primary" onclick="applyFilters()">Apply</button><button onclick="resetFilters()">Reset Filters</button></div>`}
function applyFilters(){setFilters({date:$('fDate').value,node:$('fNode').value,agent:$('fAgent').value,vendor:$('fVendor').value});render()}function resetFilters(){setFilters({});render()}function filtered(){const f=filters();return DB.customer.filter(x=>(!f.date||x.date===f.date)&&(!f.node||clean(x.node)===f.node)&&(!f.agent||clean(x.agent_email)===f.agent)&&(!f.vendor||clean(x.vendor||x.vendor_name||x['Vendor Name'])===f.vendor))}
function stat(a){const rated=a.filter(x=>['DSAT','CSAT','Neutral'].includes(x.rating_bucket)),ds=a.filter(x=>x.rating_bucket==='DSAT'),cs=a.filter(x=>x.rating_bucket==='CSAT');return{inflow:a.length,frt:a.length?+(a.reduce((s,x)=>s+num(x.agent_frt),0)/a.length).toFixed(2):0,aht:a.length?+(a.reduce((s,x)=>s+num(x.ht),0)/a.length).toFixed(2):0,dsat:pct(ds.length,rated.length),csat:pct(cs.length,rated.length),rated:rated.length,refund:a.reduce((s,x)=>s+num(x.refund_value||x.total_refunded_amount),0),refundChats:a.filter(x=>num(x.refund_chat_flag)>0).length,cancel:pct(a.filter(x=>num(x.canceled_order_flag)>0).length,a.length),delay:a.length?+(a.reduce((s,x)=>s+num(x.order_delay_mins),0)/a.length).toFixed(2):0,attempts:a.reduce((s,x)=>s+num(x.call_attempt_flag||x.attempted_call||0),0),connections:a.reduce((s,x)=>s+num(x.call_connected_flag||x.connected_call||0),0)}}
function workforce(a=DB.login){const f=filters(),l=a.filter(x=>(!f.date||dateKey(x.date)===f.date)&&(!f.agent||x.agent_email===f.agent));return{rows:l,online:l.reduce((s,x)=>s+num(x['Online Time']),0)/3600,break:l.reduce((s,x)=>s+num(x['Break Time']),0)/3600,res:l.reduce((s,x)=>s+num(x['Chat Resolved']),0),count:l.reduce((s,x)=>s+num(x['Chat Count']),0)}}
function kpis(s,l){return `<div class="kpis">${[['Total Inflow',s.inflow,'Interactions'],['AHT',s.aht+' min','Average'],['FRT',s.frt+' sec','Average'],['CSAT',s.csat+'%','Rated'],['DSAT',s.dsat+'%','Rated'],['Total Refund',INR(s.refund),'INR'],['Login Hours',l.online.toFixed(2),'Online'],['Resolution Rate',pct(l.res,l.count)+'%','Resolved / chats']].map(x=>`<div class="card kpi"><div class="klabel">${x[0]}</div><div class="kvalue">${x[1]}</div><div class="kmeta">${x[2]}</div></div>`).join('')}</div>`}
function plot(id,tr,title,layout={}){const el=$(id);if(!el)return;Plotly.newPlot(el,tr,Object.assign({title:{text:title,font:{size:14,color:'#17202a'}},margin:{l:48,r:30,t:42,b:50},paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{family:'Arial',size:11,color:'#475467'},xaxis:{gridcolor:'#eef1f4'},yaxis:{gridcolor:'#eef1f4'},hovermode:'x unified'},layout),{responsive:true,displayModeBar:false})}
function daily(a){return [...new Set(a.map(x=>x.date).filter(Boolean))].sort().map(d=>({d,s:stat(a.filter(x=>x.date===d))}))}
function agentRows(a){const by={};a.forEach(x=>{const e=clean(x.agent_email);if(!e)return;(by[e]??=[]).push(x)});return Object.entries(by).map(([e,g])=>{const s=stat(g),l=workforce(DB.login.filter(x=>x.agent_email===e));return{e,name:DB.agents[e]||g[0]?.Name||e,node:[...new Set(g.map(x=>clean(x.node)).filter(Boolean))].join(', '),s,l}})}
function table(headers,rows){return `<div class="card table"><div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td class="empty" colspan="20">No data for the selected filters.</td></tr>'}</tbody></table></div></div>`}
function viewTabs(active){return `<div class="tabs"><button class="tab ${active==='overall'?'active':''}" onclick="setView('overall')">Overall View</button><button class="tab ${active==='agent'?'active':''}" onclick="setView('agent')">Agent View</button></div>`}function setView(v){sessionStorage.setItem('znView',v);render()}
function performancePage(type){const a=filtered(),s=stat(a),l=workforce(),v=sessionStorage.getItem('znView')||'overall';let title=type==='frt'?'FRT Dashboard':type==='aht'?'AHT Dashboard':type==='inflow'?'Inflow Dashboard':type==='refund'?'Refund Dashboard':'DSAT / CSAT';if(v==='agent')return agentPerformance(title,a,type);const ds=daily(a),nodes=[...new Set(a.map(x=>clean(x.node)).filter(Boolean))].map(n=>({n,s:stat(a.filter(x=>clean(x.node)===n))}));let charts='',detail='';if(type==='frt')charts=`<div class="grid2"><div class="card chartcard"><div id="trend" class="chart"></div></div><div class="card chartcard"><div id="dist" class="chart"></div></div><div class="card chartcard"><div id="node" class="chart"></div></div><div class="card chartcard"><div id="agent" class="chart"></div></div></div>`;if(type==='aht')charts=`<div class="grid2"><div class="card chartcard"><div id="trend" class="chart"></div></div><div class="card chartcard"><div id="dist" class="chart"></div></div><div class="card chartcard"><div id="node" class="chart"></div></div><div class="card chartcard"><div id="agent" class="chart"></div></div></div>`;if(type==='inflow')charts=`<div class="grid2"><div class="card chartcard full"><div id="trend" class="chart"></div></div><div class="card chartcard"><div id="node" class="chart"></div></div><div class="card chartcard"><div id="agent" class="chart"></div></div></div>`;if(type==='refund')charts=`<div class="grid2"><div class="card chartcard"><div id="trend" class="chart"></div></div><div class="card chartcard"><div id="node" class="chart"></div></div><div class="card chartcard"><div id="agent" class="chart"></div></div></div>`;if(type==='dsat')charts=`<div class="grid2"><div class="card chartcard"><div id="trend" class="chart"></div></div><div class="card chartcard"><div id="dist" class="chart"></div></div><div class="card chartcard"><div id="node" class="chart"></div></div><div class="card chartcard"><div id="agent" class="chart"></div></div></div>`;detail=table(type==='inflow'?['Date','Inflow','Resolved','Resolution Rate']:type==='refund'?['Agent','Refund','Refund Chats','Inflow']:type==='dsat'?['Agent','Rated','CSAT','DSAT']:['Agent','Inflow','Average','Status'],type==='inflow'?ds.map(x=>`<tr><td>${ddisp(x.d)}</td><td>${x.s.inflow}</td><td>${x.s.inflow}</td><td>${pct(x.s.inflow,x.s.inflow)}%</td></tr>`).join(''):agentRows(a).map(x=>`<tr><td>${esc(x.name)}</td><td>${type==='refund'?INR(x.s.refund):type==='dsat'?x.s.rated:x.s.inflow}</td><td>${type==='refund'?x.s.refundChats:type==='dsat'?x.s.csat+'%':type==='frt'?x.s.frt:type==='aht'?x.s.aht:x.s.inflow}</td><td>${type==='dsat'?x.s.dsat+'%':x.s.inflow?'<span class="good">Available</span>':'—'}</td></tr>`).join(''));setTimeout(()=>{if(type==='frt'||type==='aht'){plot('trend',[{x:ds.map(x=>x.d),y:ds.map(x=>type==='frt'?x.s.frt:x.s.aht),type:'scatter',mode:'lines+markers'}],type==='frt'?'FRT Trend (sec)':'AHT Trend (min)');plot('dist',[{x:a.map(x=>num(type==='frt'?x.agent_frt:x.ht)).filter(x=>x>0),type:'histogram'}],type.toUpperCase()+' Distribution')}if(type==='inflow')plot('trend',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.inflow),type:'scatter',mode:'lines+markers'}],'Inflow Trend');if(type==='refund')plot('trend',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.refund),type:'scatter',mode:'lines+markers'}],'Refund Trend (₹)',{yaxis:{tickprefix:'₹'}});if(type==='dsat'){plot('trend',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.csat),type:'scatter',mode:'lines+markers',name:'CSAT %'},{x:ds.map(x=>x.d),y:ds.map(x=>x.s.dsat),type:'scatter',mode:'lines+markers',name:'DSAT %'}],'CSAT / DSAT Trend');plot('dist',[{x:['CSAT','DSAT'],y:[s.csat,s.dsat],type:'bar'}],'Rating Distribution')}const vals=type==='refund'?nodes.map(x=>x.s.refund):type==='dsat'?nodes.map(x=>x.s.dsat):type==='frt'?nodes.map(x=>x.s.frt):type==='aht'?nodes.map(x=>x.s.aht):nodes.map(x=>x.s.inflow);plot('node',[{x:nodes.map(x=>x.n),y:vals,type:'bar'}],'Node Performance');const ar=agentRows(a).sort((x,y)=>{const ky=type==='refund'?'refund':type==='dsat'?'dsat':type==='frt'?'frt':type==='aht'?'aht':'inflow';return y.s[ky]-x.s[ky]});plot('agent',[{x:ar.slice(0,20).map(x=>x.name),y:ar.slice(0,20).map(x=>type==='refund'?x.s.refund:type==='dsat'?x.s.dsat:type==='frt'?x.s.frt:type==='aht'?x.s.aht:x.s.inflow),type:'bar'}],'Agent Performance')},0);return `<div class="pagehead"><h2>${title}</h2><p>${type==='refund'?'All monetary values are shown in ₹ INR.':type==='dsat'?'Ratings are shown only where source rating data exists.':'Performance metrics based on the uploaded dataset.'}</p></div>${toolbar()}${viewTabs('overall')}${kpis(s,l)}${charts}<div class="section"><h2>${type==='inflow'?'Detailed Inflow Data':type==='refund'?'Refund Details':type==='dsat'?'Rating Records':'Performance Table'}</h2></div>${detail}`}
function agentPerformance(title,a,type){const ar=agentRows(a);return `<div class="pagehead"><h2>${title} — Agent View</h2><p>Actionable agent-level performance from uploaded data.</p></div>${toolbar()}${viewTabs('agent')}<div class="card" style="padding:14px;margin-bottom:12px"><div class="selectline"><b>Agent</b><select id="agentPick" onchange="render()"><option value="">All Agents</option>${ar.map(x=>`<option value="${esc(x.e)}">${esc(x.name)}</option>`).join('')}</select></div></div>${table(['Agent','Node','Inflow','AHT','FRT','CSAT','DSAT','Refund','Login Hours','Resolution Rate','Status'],ar.filter(x=>!$('agentPick')?.value||x.e===$('agentPick').value).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.node)}</td><td>${x.s.inflow}</td><td>${x.s.aht} min</td><td>${x.s.frt} sec</td><td>${x.s.csat}%</td><td>${x.s.dsat}%</td><td>${INR(x.s.refund)}</td><td>${x.l.online.toFixed(2)}</td><td>${pct(x.l.res,x.l.count)}%</td><td><span class="badge ${x.s.dsat>50?'bad':'good'}">${x.s.dsat>50?'Review':'On Track'}</span></td></tr>`).join(''))}`}
function overview(){const a=filtered(),s=stat(a),l=workforce(),ds=daily(a),nodes=[...new Set(a.map(x=>clean(x.node)).filter(Boolean))].map(n=>({n,s:stat(a.filter(x=>clean(x.node)===n))})),ar=agentRows(a);setTimeout(()=>{plot('ovInflow',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.inflow),type:'scatter',mode:'lines+markers'}],'Inflow Trend');plot('ovSpeed',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.frt),type:'scatter',mode:'lines+markers',name:'FRT sec'},{x:ds.map(x=>x.d),y:ds.map(x=>x.s.aht),type:'scatter',mode:'lines+markers',name:'AHT min',yaxis:'y2'}],'FRT vs AHT',{yaxis2:{overlaying:'y',side:'right'}});plot('ovQuality',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.csat),type:'scatter',mode:'lines+markers',name:'CSAT %'},{x:ds.map(x=>x.d),y:ds.map(x=>x.s.dsat),type:'scatter',mode:'lines+markers',name:'DSAT %'}],'CSAT / DSAT');plot('ovRefund',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.refund),type:'bar'}],'Refund Trend (₹)',{yaxis:{tickprefix:'₹'}});plot('ovNode',[{x:nodes.map(x=>x.n),y:nodes.map(x=>x.s.inflow),type:'bar'}],'Node Performance');plot('ovAgent',[{x:ar.slice(0,15).map(x=>x.name),y:ar.slice(0,15).map(x=>x.s.inflow),type:'bar'}],'Agent Performance')},0);return `<div class="pagehead"><h2>Overview</h2><p>Concise operational summary for the selected dataset and filters.</p></div>${toolbar()}${kpis(s,l)}<div class="grid2"><div class="card chartcard"><div id="ovInflow" class="chart"></div><button class="btn" onclick="go('/inflow')">View Details →</button></div><div class="card chartcard"><div id="ovSpeed" class="chart"></div><button class="btn" onclick="go('/frt')">View Details →</button></div><div class="card chartcard"><div id="ovQuality" class="chart"></div><button class="btn" onclick="go('/dsat-csat')">View Details →</button></div><div class="card chartcard"><div id="ovRefund" class="chart"></div><button class="btn" onclick="go('/refund')">View Details →</button></div><div class="card chartcard"><div id="ovNode" class="chart"></div><button class="btn" onclick="go('/node-intelligence')">View Details →</button></div><div class="card chartcard"><div id="ovAgent" class="chart"></div><button class="btn" onclick="go('/agent-360')">View Details →</button></div></div><div class="section"><h2>Quick Insights</h2></div><div class="insights"><div class="card insight"><b>DSAT</b><div class="muted">${s.dsat}% of rated interactions are detractors.</div></div><div class="card insight"><b>Refund</b><div class="muted">${INR(s.refund)} across ${s.refundChats} refund chats.</div></div><div class="card insight"><b>Delay</b><div class="muted">Average order delay: ${s.delay} min.</div></div></div>`}
function uploadPage(){return `<div class="pagehead"><h2>Upload Data</h2><p>Upload, validate and persist operational data in this browser using IndexedDB.</p></div><div class="card upload"><div class="uploadgrid"><div class="uploadbox"><b>Customer / Operations files</b><input id="customerFiles" type="file" multiple accept=".xlsx,.xls,.csv"></div><div class="uploadbox"><b>Login / Workforce files</b><input id="loginFiles" type="file" multiple accept=".xlsx,.xls,.csv"></div></div><div id="drop" class="drop"><b>Drag &amp; drop one or more XLSX/XLS/CSV files</b><span class="muted">Files are processed locally in your browser.</span></div><div class="actions"><button class="btn primary" onclick="startUpload()">Process &amp; Save Dataset</button><button class="btn" onclick="go('/overview')">View Dashboard</button></div><div id="uploadMsg" class="notice" style="margin-top:12px">${DB.upload.fileNames?`Current dataset: ${DB.upload.fileNames.join(', ')} • ${DB.customer.length.toLocaleString()} interaction rows`:'No dataset uploaded yet.'}</div><div class="section"><h2>Current Dataset</h2></div><div class="detailgrid"><div class="card detail"><small>Dataset Status</small><strong>${DB.customer.length?'Ready':'No Dataset'}</strong></div><div class="card detail"><small>Rows</small><strong>${DB.customer.length.toLocaleString()}</strong></div><div class="card detail"><small>Date Range</small><strong>${DB.upload.dateRange?.length?ddisp(DB.upload.dateRange[0])+' – '+ddisp(DB.upload.dateRange.at(-1)):'—'}</strong></div><div class="card detail"><small>Last Updated</small><strong>${DB.upload.uploadedAt?new Date(DB.upload.uploadedAt).toLocaleString():'—'}</strong></div></div><div class="actions"><button class="btn" onclick="downloadDataset('csv')">Download Dataset CSV</button><button class="btn" onclick="downloadDataset('xlsx')">Download Dataset XLSX</button><button class="btn" onclick="clearDataset()">Clear Dataset</button></div><div class="section"><h2>Processing Stages</h2></div><div class="notice">Reading files → Detecting sheets → Detecting datasets → Mapping columns → Validating data → Processing metrics → Saving dataset → Dashboard updated</div></div>`}
async function startUpload(){const fs=[...document.querySelectorAll('#customerFiles,#loginFiles')].flatMap(x=>[...x.files]);await processFiles([...new Map(fs.map(f=>[f.name+f.size,f])).values()])}
function nodePage(){const a=filtered(),nodes=[...new Set(a.map(x=>clean(x.node)).filter(Boolean))].sort(),f=filters(),n=f.node||nodes[0]||'',g=a.filter(x=>clean(x.node)===n),s=stat(g),ar=agentRows(g);return `<div class="pagehead"><h2>Node Intelligence</h2><p>Selected node performance and agent ranking.</p></div>${toolbar()}<div class="card" style="padding:14px;margin-bottom:12px"><div class="selectline"><b>Node</b><select onchange="setNode(this.value)">${nodes.map(x=>`<option ${x===n?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div></div>${kpis(s,workforce(DB.login))}<div class="grid2"><div class="card chartcard"><div id="ntrend" class="chart"></div></div><div class="card chartcard"><div id="nagent" class="chart"></div></div></div><div class="section"><h2>Agent ranking within selected node</h2></div>${table(['Agent','Inflow','AHT','FRT','CSAT','DSAT','Refund'],ar.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.s.inflow}</td><td>${x.s.aht}</td><td>${x.s.frt}</td><td>${x.s.csat}%</td><td>${x.s.dsat}%</td><td>${INR(x.s.refund)}</td></tr>`).join(''))}`}
function setNode(n){const f=filters();f.node=n;setFilters(f);render()}
function agent360(){const ar=agentRows(filtered()),f=filters(),e=f.agent||ar[0]?.e||'',x=ar.find(z=>z.e===e);if(!x)return `<div class="pagehead"><h2>Agent 360</h2></div>${toolbar()}<div class="empty">No agent data available.</div>`;const g=filtered().filter(r=>r.agent_email===e),ds=daily(g);setTimeout(()=>{plot('aTrend',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.inflow),type:'scatter',mode:'lines+markers'}],'Daily Inflow');plot('aAht',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.aht),type:'scatter',mode:'lines+markers'}],'AHT Trend');plot('aFrt',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.frt),type:'scatter',mode:'lines+markers'}],'FRT Trend');plot('aQual',[{x:ds.map(x=>x.d),y:ds.map(x=>x.s.csat),type:'scatter',mode:'lines+markers',name:'CSAT'},{x:ds.map(x=>x.d),y:ds.map(x=>x.s.dsat),type:'scatter',mode:'lines+markers',name:'DSAT'}],'CSAT / DSAT')},0);return `<div class="pagehead"><h2>Agent 360</h2><p>Complete agent profile based on actual uploaded data.</p></div>${toolbar()}<div class="card" style="padding:14px;margin-bottom:12px"><div class="selectline"><b>Agent</b><select onchange="setAgent(this.value)">${ar.map(z=>`<option ${z.e===e?'selected':''} value="${esc(z.e)}">${esc(z.name)}</option>`).join('')}</select></div></div><div class="detailgrid"><div class="card detail"><small>Agent</small><strong>${esc(x.name)}</strong></div><div class="card detail"><small>Email</small><strong>${esc(x.e)}</strong></div><div class="card detail"><small>Node</small><strong>${esc(x.node||'—')}</strong></div><div class="card detail"><small>Vendor</small><strong>${esc([...new Set(g.map(r=>r.vendor||r.vendor_name||r['Vendor Name']||'').filter(Boolean))].join(', ')||'—')}</strong></div></div>${kpis(x.s,x.l)}<div class="grid2"><div class="card chartcard"><div id="aTrend" class="chart"></div></div><div class="card chartcard"><div id="aAht" class="chart"></div></div><div class="card chartcard"><div id="aFrt" class="chart"></div></div><div class="card chartcard"><div id="aQual" class="chart"></div></div></div><div class="section"><h2>Detailed interactions</h2></div>${rawTable(g,20)}`}
function setAgent(e){const f=filters();f.agent=e;setFilters(f);render()}
function rawTable(a,limit=20){const cols=['session_id','date','agent_email','Name','node','agent_frt','ht','session_rating','refund_value','order_delay_mins','refund_chat_flag','canceled_order_flag'];return table(cols.map(esc),a.slice(0,limit).map(r=>`<tr>${cols.map(c=>`<td>${esc(c==='date'?ddisp(r[c]):c==='refund_value'?INR(r[c]):r[c])}</td>`).join('')}</tr>`).join(''))}
function rawExplorer(){return `<div class="pagehead"><h2>Raw Interaction Explorer</h2><p>Searchable normalized interaction records from the uploaded dataset.</p></div>${toolbar()}<div class="card" style="padding:10px;margin-bottom:12px"><input class="search" id="rawSearch" placeholder="Search session, agent, node, email…" oninput="renderRaw()"></div><div id="rawResults"></div>`}
function renderRaw(){const q=clean($('rawSearch')?.value).toLowerCase(),a=filtered().filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));$('rawResults').innerHTML=rawTable(a,100)}
function quality(){const a=DB.customer,L=DB.login,dates=a.filter(x=>!x.date).length,agent=a.filter(x=>!x.agent_email).length,node=a.filter(x=>!clean(x.node)).length,frt=a.filter(x=>getv(x,['agent_frt'])==null).length,aht=a.filter(x=>getv(x,['ht'])==null).length,ratingMissing=a.filter(x=>!['DSAT','CSAT','Neutral'].includes(x.rating_bucket)).length;return `<div class="pagehead"><h2>Data Quality</h2><p>Validation and transparency for the current dataset.</p></div><div class="detailgrid"><div class="card detail"><small>Interaction Rows</small><strong>${a.length.toLocaleString()}</strong></div><div class="card detail"><small>Workforce Rows</small><strong>${L.length.toLocaleString()}</strong></div><div class="card detail"><small>Missing Dates</small><strong>${dates}</strong></div><div class="card detail"><small>Missing Agent Email</small><strong>${agent}</strong></div><div class="card detail"><small>Missing Node</small><strong>${node}</strong></div><div class="card detail"><small>Missing FRT</small><strong>${frt}</strong></div><div class="card detail"><small>Missing AHT</small><strong>${aht}</strong></div><div class="card detail"><small>Missing Ratings</small><strong>${ratingMissing}</strong></div></div><div class="section"><h2>Data quality status</h2></div><div class="notice ${dates||agent||node||frt||aht?'dangerbox':'success'}">${dates||agent||node||frt||aht?'Warnings detected. Problematic records remain available and are not silently discarded.':'No structural warnings detected in the current normalized dataset.'}</div>`}
function workforcePage(){const l=workforce(),by={};l.rows.forEach(x=>(by[x.agent_email]??=[]).push(x));return `<div class="pagehead"><h2>Workforce</h2><p>Login, break, resolved and chat-count metrics aggregated from workforce slots.</p></div>${toolbar()}${kpis(stat(filtered()),l)}${table(['Agent','Online Hours','Break Hours','Chat Count','Resolved','Resolution Rate'],Object.entries(by).map(([e,g])=>{let x=workforce(g);return`<tr><td>${esc(DB.agents[e]||e)}</td><td>${x.online.toFixed(2)}</td><td>${x.break.toFixed(2)}</td><td>${x.count}</td><td>${x.res}</td><td>${pct(x.res,x.count)}%</td></tr>`}).join(''))}`}
function coaching(){const ar=agentRows(filtered()).sort((a,b)=>b.s.dsat-a.s.dsat);return `<div class="pagehead"><h2>Coaching</h2><p>Prioritized coaching view using observed performance metrics only.</p></div>${toolbar()}${table(['Priority','Agent','DSAT','AHT','FRT','Refund','Focus'],ar.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.s.dsat}%</td><td>${x.s.aht} min</td><td>${x.s.frt} sec</td><td>${INR(x.s.refund)}</td><td>${x.s.dsat>50?'DSAT review':x.s.aht>15?'AHT review':x.s.frt>10?'FRT review':'No immediate flag'}</td></tr>`).join(''))}`}
function comparisons(kind){const a=filtered(),by=[...new Set(a.map(x=>clean(x.node)).filter(Boolean))].map(n=>({n,s:stat(a.filter(x=>clean(x.node)===n))}));const y=kind==='dsat'?by.map(x=>x.s.dsat):by.map(x=>x.s.refund);return `<div class="pagehead"><h2>${kind==='dsat'?'Inflow vs DSAT':'Inflow vs Refund'}</h2><p>Relationship view using actual node-level uploaded data.</p></div>${toolbar()}<div class="card chartcard"><div id="cmp" class="chart"></div></div>`+(()=>{setTimeout(()=>plot('cmp',[{x:by.map(x=>x.s.inflow),y,mode:'markers',type:'scatter',text:by.map(x=>x.n)}],kind==='dsat'?'Inflow vs DSAT %':'Inflow vs Refund ₹',{xaxis:{title:'Inflow'},yaxis:{title:kind==='dsat'?'DSAT %':'Refund ₹'}}),0);return''})()}
function exportsPage(){return `<div class="pagehead"><h2>Exports</h2><p>Generate actual CSV/XLSX files from the current filtered data.</p></div><div class="exportgrid"><div class="card exportcard"><h3>Raw Data</h3><p>Current filtered interaction dataset.</p><button class="btn" onclick="downloadDataset('csv')">Download CSV</button><button class="btn" onclick="downloadDataset('xlsx')">Download XLSX</button></div><div class="card exportcard"><h3>Workforce / Slot Data</h3><p>Current workforce slot records.</p><button class="btn" onclick="downloadRows(DB.login,'Workforce','csv')">Download CSV</button><button class="btn" onclick="downloadRows(DB.login,'Workforce','xlsx')">Download XLSX</button></div><div class="card exportcard"><h3>Agent Performance</h3><p>Aggregated agent metrics.</p><button class="btn" onclick="downloadAgent('csv')">Download CSV</button><button class="btn" onclick="downloadAgent('xlsx')">Download XLSX</button></div><div class="card exportcard"><h3>Node Performance</h3><p>Aggregated node metrics.</p><button class="btn" onclick="downloadNode('csv')">Download CSV</button><button class="btn" onclick="downloadNode('xlsx')">Download XLSX</button></div><div class="card exportcard"><h3>FRT / AHT / Inflow</h3><p>Dashboard metric report.</p><button class="btn" onclick="downloadMetric('performance','csv')">Download CSV</button><button class="btn" onclick="downloadMetric('performance','xlsx')">Download XLSX</button></div><div class="card exportcard"><h3>Refund / DSAT / CSAT</h3><p>Quality and refund report.</p><button class="btn" onclick="downloadMetric('quality','csv')">Download CSV</button><button class="btn" onclick="downloadMetric('quality','xlsx')">Download XLSX</button></div></div>`}
function downloadRows(rows,name,fmt){const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'Data');if(fmt==='csv')saveBlob(new Blob([XLSX.write(wb,{bookType:'csv',type:'array'})],{type:'text/csv'}),name+'.csv');else saveBlob(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx')}function saveBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadDataset(f){downloadRows(filtered(),'Zomato_Niftel_Filtered_Interactions',f)}function downloadAgent(f){downloadRows(agentRows(filtered()).map(x=>({Agent:x.name,Email:x.e,Node:x.node,Inflow:x.s.inflow,AHT:x.s.aht,FRT:x.s.frt,CSAT:x.s.csat,DSAT:x.s.dsat,Refund_INR:x.s.refund,Login_Hours:x.l.online,Resolution_Rate:pct(x.l.res,x.l.count)})),'Agent_Performance',f)}function downloadNode(f){const a=filtered();const ns=[...new Set(a.map(x=>clean(x.node)).filter(Boolean))].map(n=>{let s=stat(a.filter(x=>clean(x.node)===n));return{Node:n,...s}});downloadRows(ns,'Node_Performance',f)}function downloadMetric(k,f){const a=filtered();const ds=daily(a).map(x=>({Date:x.d,Inflow:x.s.inflow,AHT:x.s.aht,FRT:x.s.frt,CSAT:x.s.csat,DSAT:x.s.dsat,Refund_INR:x.s.refund}));downloadRows(ds,k==='quality'?'Quality_Report':'Performance_Report',f)}
async function clearDataset(){if(!confirm('Clear the current dataset from this browser?'))return;DB={customer:[],login:[],agents:{},meta:{expectedLoginHours:8,expectedBreakHours:1},upload:{}};await persist();render()}
function nav(){const groups=[['OVERVIEW',[['/overview','Overview']]],['DATA',[['/upload','Upload Data'],['/data-quality','Data Quality'],['/raw-explorer','Raw Explorer']]],['PERFORMANCE',[['/frt','FRT Dashboard'],['/aht','AHT Dashboard'],['/inflow','Inflow Dashboard'],['/refund','Refund Dashboard'],['/dsat-csat','DSAT / CSAT']]],['ANALYSIS',[['/inflow-vs-dsat','Inflow vs DSAT'],['/inflow-vs-refund','Inflow vs Refund'],['/node-intelligence','Node Intelligence'],['/agent-360','Agent 360']]],['WORKFORCE',[['/workforce','Workforce'],['/coaching','Coaching']]],['OUTPUT',[['/exports','Exports']]]];const path=location.pathname==='/index.html'?'/overview':location.pathname;return groups.map(g=>`<div class="navgroup"><div class="navlabel">${g[0]}</div>${g[1].map(x=>`<a href="${x[0]}" class="${path===x[0]?'active':''}">${x[1]}</a>`).join('')}</div>`).join('')}
function go(path){history.pushState({},'',path);render()}window.addEventListener('popstate',render);document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/"]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
function render(){const path=location.pathname==='/index.html'?'/overview':location.pathname;document.getElementById('nav').innerHTML=nav();let html=path==='/overview'?overview():path==='/upload'?uploadPage():path==='/frt'?performancePage('frt'):path==='/aht'?performancePage('aht'):path==='/inflow'?performancePage('inflow'):path==='/refund'?performancePage('refund'):path==='/dsat-csat'?performancePage('dsat'):path==='/inflow-vs-dsat'?comparisons('dsat'):path==='/inflow-vs-refund'?comparisons('refund'):path==='/node-intelligence'?nodePage():path==='/agent-360'?agent360():path==='/workforce'?workforcePage():path==='/coaching'?coaching():path==='/data-quality'?quality():path==='/raw-explorer'?rawExplorer():path==='/exports'?exportsPage():overview();$('app').innerHTML=html;if(path==='/raw-explorer')renderRaw();window.scrollTo(0,0)}async function refresh(){await load();render()}
window.addEventListener('DOMContentLoaded',async()=>{await load();render();const d=$('drop');if(d){d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();const fs=[...e.dataTransfer.files].filter(f=>/\.(xlsx|xls|csv)$/i.test(f.name));const c=$('customerFiles');if(c){const dt=new DataTransfer();fs.forEach(f=>dt.items.add(f));c.files=dt.files}}}});window.startUpload=startUpload;window.processFiles=processFiles;window.DB=DB;
</script><script id="niftel-ui-patch">(function(){function ready(){var b=document.querySelector('.actions .primary');if(b)b.textContent='Upload Files';var panel=document.querySelector('#upload');if(panel&&!document.getElementById('detected')){var d=document.createElement('div');d.id='detected';d.className='detected hidden';panel.insertBefore(d,panel.querySelector('#status'));}var actions=document.querySelector('.actions');if(actions&&!document.getElementById('processBtn')){var p=document.createElement('button');p.id='processBtn';p.className='btn secondary';p.textContent='Process Data';p.onclick=function(){if(typeof uploadFiles==='function')uploadFiles()};actions.insertBefore(p,actions.children[1]);}var hs=document.getElementById('headerStatus');if(hs)hs.textContent='Data Status: Ready';var fileInputs=document.querySelectorAll('input[type=file]');fileInputs.forEach(function(inp){inp.addEventListener('change',function(){var files=Array.from(inp.files||[]);if(!files.length)return;var d=document.getElementById('detected');if(d){d.classList.remove('hidden');d.innerHTML='<b>Files Detected</b><div>'+files.map(function(f){return f.name.replace(/[&<>]/g,'')}).join('</div><div>')+'</div>';}})});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();})();</script></body></html>
