name: Fix date parsing only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  date-only-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only date parsing and filtering
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Normalize every supported source date to YYYY-MM-DD.
          robust = r'''function dateKey(v){
            const valid=(y,m,d)=>{if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||y<1900||y>2100||m<1||m>12||d<1||d>31)return '';const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?dt.toISOString().slice(0,10):''};
            if(v instanceof Date&&!isNaN(v.getTime()))return valid(v.getUTCFullYear(),v.getUTCMonth()+1,v.getUTCDate());
            if(typeof v==='number'&&Number.isFinite(v)){
              const n=Math.trunc(v),raw=String(n);
              if(/^\d{8}$/.test(raw)){const k=valid(+raw.slice(0,4),+raw.slice(4,6),+raw.slice(6,8));if(k)return k;}
              if(v>0&&v<2958466){const ms=Math.round((v-25569)*86400*1000),dt=new Date(ms);if(!isNaN(dt.getTime()))return valid(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());}
              return '';
            }
            let s=clean(v);if(!s)return '';
            s=s.replace(/\u00a0/g,' ').trim();
            let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s].*)?$/);if(m){const k=valid(+m[1],+m[2],+m[3]);if(k)return k;return '';}
            m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:[\sT].*)?$/);if(m){let a=+m[1],b=+m[2],y=+m[3];if(a>12&&b<=12){const k=valid(y,b,a);if(k)return k;}if(b>12&&a<=12){const k=valid(y,a,b);if(k)return k;}const k=valid(y,b,a);if(k)return k;return valid(y,a,b);}
            m=s.match(/^(\d{4})(\d{2})(\d{2})(?:[\sT].*)?$/);if(m){const k=valid(+m[1],+m[2],+m[3]);if(k)return k;return '';}
            return '';
          }'''

          # Replace only the existing dateKey function body.
          s, n = re.subn(r'function dateKey\(v\)\{.*?\n\}', lambda m: robust, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dateKey function not found')

          # Never display an invalid/raw value in the date dropdown.
          s = s.replace("const dates=[...new Set(c.map(x=>clean(x.date)).filter(Boolean))].sort();", "const dates=[...new Set(c.map(x=>dateKey(x.date)).filter(Boolean))].sort();", 1)
          s = s.replace("function selected(){return(DATA.customer||[]).filter(x=>(!$('dateF').value||clean(x.date)===$('dateF').value)", "function selected(){return(DATA.customer||[]).filter(x=>(!$('dateF').value||dateKey(x.date)===$('dateF').value)", 1)
          s = s.replace("function loginStats(L,filterDate,filterAgent){const f=L.filter(x=>(!filterDate||clean(x.date)===filterDate)", "function loginStats(L,filterDate,filterAgent){const f=L.filter(x=>(!filterDate||dateKey(x.date)===filterDate)", 1)

          # Keep all other calculations/UI untouched; only normalize date values used by date-based chart grouping.
          s = s.replace("const dates=[...new Set(a.map(x=>clean(x.date)).filter(Boolean))].sort();", "const dates=[...new Set(a.map(x=>dateKey(x.date)).filter(Boolean))].sort();", 1)
          s = s.replace("a.filter(x=>clean(x.date)===d).length", "a.filter(x=>dateKey(x.date)===d).length", 1)
          s = s.replace("a.filter(z=>clean(z.date)===x.d)", "a.filter(z=>dateKey(z.date)===x.d)", 2)
          s = s.replace("[...new Set(lr.map(x=>clean(x.date)).filter(Boolean))].sort()", "[...new Set(lr.map(x=>dateKey(x.date)).filter(Boolean))].sort()", 2)
          s = s.replace("lr.filter(x=>clean(x.date)===d)", "lr.filter(x=>dateKey(x.date)===d)", 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S))
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Commit date-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No date changes needed"
          else
            git commit -m "Fix date parsing and date filter only"
            git push
          fi
