name: Apply Niftel branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep official branding without legacy dark UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Zomato Operations Control Tower</title>','<title>Zomato Niftel Dashboard</title>')
          s=s.replace('Zomato Operations Control Tower','Zomato Niftel Dashboard')
          s=s.replace('Operations • Quality • Refund • Workforce • Agent 360','Customer Support Performance &amp; Operations Analytics')
          p.write_text(s,encoding='utf-8')
      - name: Commit branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Keep Niftel branding clean"; git push; fi
