name: Fix dashboard date handling

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard UI and date handling
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Official branding only.
          replacements = {
            'Zomato Operations Control Tower':'Zomato Niftel Dashboard',
            'Operations Command Center':'Zomato Niftel Dashboard',
            'Command Center':'Zomato Niftel Dashboard',
            'Operations Intelligence Command Center':'Zomato Niftel Dashboard',
            'Zomato Operations Hub':'Zomato Niftel Dashboard',
            'Zomato Operations Intelligence':'Zomato Niftel Dashboard',
            'Ops Command Center':'Zomato Niftel Dashboard',
            'Operations Control Room':'Zomato Niftel Dashboard',
            'Control Room':'Zomato Niftel Dashboard',
            'Cyber Command Center':'Zomato Niftel Dashboard',
            'Cyberpunk Command':'Zomato Niftel Dashboard',
            'Intelligence Command Center':'Zomato Niftel Dashboard',
            '🍅':'ZN'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('Operations • Quality • Refund • Workforce • Agent 360','Customer Support Performance & Operations Analytics')

          # Correct date display for YYYYMMDD source values.
          if 'function displayDate(v)' not in s:
              s = s.replace('function rating(v){', "function displayDate(v){const k=dateKey(v);if(!k)return '';const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const a=k.split('-');if(a.length!==3)return k;return `${a[2]} ${m[Number(a[1])-1]} ${a[0]}`}\n\nfunction rating(v){", 1)
          s = s.replace("$('dateF').innerHTML='<option value=\"\">All Dates</option>'+dates.map(x=>`<option value=\"${esc(x)}\">${esc(x)}</option>`).join('');", "$('dateF').innerHTML='<option value=\"\">All Dates</option>'+dates.map(x=>`<option value=\"${esc(x)}\">${esc(displayDate(x))}</option>`).join('');", 1)

          # Refresh existing rows instead of leaving stale malformed dates in local storage.
          start=s.find('async function uploadFiles(){'); end=s.find('\n\nfunction setStatus',start)
          if start>=0 and end>start and 'Updated ${updatedC}' not in s[start:end]:
              new_upload='''async function uploadFiles(){const cf=$('customerFile').files[0],lf=$('loginFile').files[0];if(!cf&&!lf){setStatus('Please select at least one dump first.',true);return}setStatus('Reading dump(s) locally…');try{const [cwb,lwb]=await Promise.all([cf?readFile(cf):Promise.resolve(null),lf?readFile(lf):Promise.resolve(null)]);let customer=[],login=[],agents={};if(cwb){const p=parseCustomer(cwb);customer=p.C;agents=p.agents;const autoLogin=parseLogin(cwb);if(autoLogin.length)login=autoLogin}if(lwb)login=parseLogin(lwb);const existingC=new Map(DATA.customer.map((x,i)=>[clean(x.session_id),i]).filter(([k])=>k));const existingL=new Map(DATA.login.map((x,i)=>[x.unique_key||[x.date,x.agent_email,x.slot_start,x.slot_end].join('|'),i]).filter(([k])=>k));let addedC=0,updatedC=0;customer.forEach(r=>{const k=clean(r.session_id);if(!k)return;if(existingC.has(k)){DATA.customer[existingC.get(k)]=r;updatedC++}else{existingC.set(k,DATA.customer.length);DATA.customer.push(r);addedC++}});let addedL=0,updatedL=0;login.forEach(r=>{const k=r.unique_key||[r.date,r.agent_email,r.slot_start,r.slot_end].join('|');if(!k)return;if(existingL.has(k)){DATA.login[existingL.get(k)]=r;updatedL++}else{existingL.set(k,DATA.login.length);DATA.login.push(r);addedL++}});DATA.agents=Object.assign({},DATA.agents||{},agents);DATA.meta=Object.assign({expectedLoginHours:8,expectedBreakHours:1},DATA.meta||{});saveLocal();populate();render();setStatus(`Upload complete • Added ${addedC} customer rows • Updated ${updatedC} customer rows • Added ${addedL} login rows • Updated ${updatedL} login rows • Stored locally in this browser`)}catch(e){setStatus('Upload failed: '+(e.message||e),true)}}'''
              s=s[:start]+new_upload+s[end:]

          # Add Vendor to global filtering when the uploaded dataset contains a vendor field.
          s=s.replace("const agents=[...new Set(c.map(x=>clean(x.agent_email)).filter(Boolean)).sort();$('dateF').innerHTML", "const agents=[...new Set(c.map(x=>clean(x.agent_email)).filter(Boolean)).sort();const vendors=[...new Set(c.map(x=>clean(x.vendor||x.vendor_name||x['Vendor Name']||'')).filter(Boolean)).sort();if($('vendorF'))$('vendorF').innerHTML='<option value=\"\">All Vendors</option>'+vendors.map(x=>`<option value=\"${esc(x)}\">${esc(x)}</option>`).join('');$('dateF').innerHTML", 1)
          s=s.replace("function selected(){return(DATA.customer||[]).filter(x=>(!$('dateF').value||clean(x.date)===$('dateF').value)&&(!$('nodeF').value||clean(x.node)===$('nodeF').value)&&(!$('agentF').value||clean(x.agent_email)===$('agentF').value))}", "function selected(){const v=$('vendorF')?.value||'';return(DATA.customer||[]).filter(x=>(!$('dateF').value||clean(x.date)===$('dateF').value)&&(!$('nodeF').value||clean(x.node)===$('nodeF').value)&&(!$('agentF').value||clean(x.agent_email)===$('agentF').value)&&(!v||clean(x.vendor||x.vendor_name||x['Vendor Name']||'')===v))}", 1)
          s=s.replace("function resetF(){$('dateF').value='';$('nodeF').value='';$('agentF').value='';render()}", "function resetF(){$('dateF').value='';$('nodeF').value='';$('agentF').value='';if($('vendorF'))$('vendorF').value='';render()}", 1)

          # Keep Overview KPI row compact and operational.
          old="$('kpis').innerHTML=[['Inflow',s.inflow,'Chats'],['Avg FRT',s.frt+' sec','Target: monitor'],['Avg AHT',s.aht+' min','Minutes'],['DSAT',s.dsat+'%','Rated chats'],['CSAT',s.csat+'%','Rated chats'],['Refund',INR(s.refund),'Total refunded'],['Cancellation',s.cancel+'%','Flagged orders'],['Avg Delay',s.delay+' min','Order delay'],['Online Hours',ls.online.toFixed(2),`Expected ${exp}h/agent`],['Break Hours',ls.br.toFixed(2),`Expected ${expB}h/agent`]].map"
          new="$('kpis').innerHTML=[['Inflow',s.inflow,'Chats'],['Avg AHT',s.aht+' min','Minutes'],['Avg FRT',s.frt+' sec','Seconds'],['DSAT',s.dsat+'%','Rated chats'],['CSAT',s.csat+'%','Rated chats'],['Refund',INR(s.refund),'Total refunded'],['Login Hours',ls.online.toFixed(2),'Online time'],['Resolution Rate',pct(ls.res,ls.count)+'%','Resolved / chat count']].map"
          s=s.replace(old,new,1)

          # Compact, grouped sidebar.
          nav='''<nav class="nav"><div class="nav-group"><div class="nav-label">OVERVIEW</div><a href="#overview">Overview</a></div><div class="nav-group"><div class="nav-label">DATA</div><a href="#uploadPage">Upload Data</a><a href="#data-quality">Data Quality</a><a href="#agent360">Raw Interaction Explorer</a></div><div class="nav-group"><div class="nav-label">PERFORMANCE</div><a href="#frt">FRT Dashboard</a><a href="#aht">AHT Dashboard</a><a href="#inflow-section">Inflow Dashboard</a><a href="#refund">Refund Dashboard</a><a href="#quality-section">DSAT / CSAT</a></div><div class="nav-group"><div class="nav-label">ANALYSIS</div><a href="#node-section">Inflow vs DSAT</a><a href="#refund">Inflow vs Refund</a><a href="#node-section">Node Intelligence</a><a href="#agent360">Agent 360</a></div><div class="nav-group"><div class="nav-label">WORKFORCE</div><a href="#workforce">Workforce</a><a href="#agent360">Coaching</a></div><div class="nav-group"><div class="nav-label">OUTPUT</div><a href="#exports">Exports</a></div></nav>'''
          s=re.sub(r'<nav class="nav">.*?</nav>',nav,s,flags=re.S)

          # Upload interface lives in its own tab. Overview remains focused on metrics.
          css='''<style id="uiux-overrides">.nav{gap:10px}.nav-group{display:flex;flex-direction:column;gap:2px}.nav-label{font-size:9px;letter-spacing:1.2px;color:#6f858d;font-weight:900;padding:7px 12px 3px}.nav-group:first-child .nav-label{padding-top:0}.nav a{padding:8px 12px}.logo{font-size:15px;font-weight:900;letter-spacing:-.5px}.upload-page-shell{display:none;max-width:1800px;margin:auto;padding:22px 24px 40px}.upload-page-shell.active{display:block}.dashboard-main-hidden{display:none!important}.upload-page-card{max-width:1100px;margin:0 auto}.upload-page-card .uploadgrid{grid-template-columns:1fr 1fr}.upload-page-card .uploadbox{min-height:118px;display:flex;flex-direction:column;justify-content:center}.drop-zone{margin-top:14px;border:1px dashed rgba(45,226,230,.35);border-radius:16px;padding:18px;text-align:center;background:rgba(45,226,230,.035);color:var(--muted)}.drop-zone b{display:block;color:#fff;margin-bottom:5px}.drop-zone span{font-size:11px}.upload-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.upload-meta .meta-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.meta-card small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}.meta-card strong{font-size:12px;color:#fff}.process-card{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}.process-title{font-size:12px;font-weight:800;margin-bottom:10px}.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.stage{padding:9px 6px;border-radius:9px;background:rgba(255,255,255,.035);color:#7f9097;font-size:9px;text-align:center}.stage.active{color:#fff;border:1px solid rgba(45,226,230,.35);background:rgba(45,226,230,.07)}.stage.done{color:#b8e9df}.upload-success{margin-top:12px;padding:11px 12px;border-radius:11px;background:rgba(22,131,75,.1);border:1px solid rgba(22,131,75,.25);color:#bcebd4;font-size:11px}.file-list{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.7}@media(max-width:900px){.upload-meta,.stages{grid-template-columns:1fr 1fr}.upload-page-shell{padding:14px}.upload-page-card .uploadgrid{grid-template-columns:1fr}}</style>'''
          if 'id="uiux-overrides"' not in s: s=s.replace('</head>',css+'</head>',1)

          controller=r'''<script id="uiux-controller">(function(){function setup(){const upload=document.getElementById('upload'),main=document.querySelector('main');if(!upload||!main||document.getElementById('uploadPage'))return;const shell=document.createElement('section');shell.id='uploadPage';shell.className='upload-page-shell';shell.innerHTML='<div class="sectiontitle"><div><h2>Upload Data</h2><span>Upload and process your latest operational raw dumps</span></div><button class="btn secondary" onclick="showDashboard()">View Dashboard</button></div>';const card=document.createElement('div');card.className='panel upload-page-card';const head=document.createElement('div');head.innerHTML='<div class="section-eyebrow">UPLOAD DATA</div><div class="upload-head"><h2>Upload your raw dump</h2><p>Upload your Excel or CSV files and the dashboard will automatically read, process and calculate the required metrics.</p></div>';card.appendChild(head);const grid=upload.querySelector('.uploadgrid');if(grid)card.appendChild(grid);const status=upload.querySelector('#status');if(status)card.appendChild(status);const restore=upload.querySelector('div[style*="Optional restore"]');if(restore)card.appendChild(restore);const drop=document.createElement('div');drop.className='drop-zone';drop.innerHTML='<b>Drag & drop your files here</b><span>Supported formats: .xlsx, .xls, .csv</span>';drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();const fs=[...e.dataTransfer.files];const f=fs.find(x=>/\.(xlsx|xls|csv)$/i.test(x.name));if(f){const input=document.getElementById('customerFile');if(input){const dt=new DataTransfer();dt.items.add(f);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}))}}};card.appendChild(drop);const meta=document.createElement('div');meta.className='upload-meta';meta.innerHTML='<div class="meta-card"><small>Files Detected</small><strong id="uiFilesDetected">0</strong></div><div class="meta-card"><small>Processed Rows</small><strong id="uiRows">0</strong></div><div class="meta-card"><small>Last Successful Upload</small><strong id="uiLastUpload">—</strong></div><div class="meta-card"><small>Data Status</small><strong id="uiDataStatus">Ready</strong></div>';card.appendChild(meta);const proc=document.createElement('div');proc.className='process-card';proc.innerHTML='<div class="process-title">Processing progress</div><div class="stages">'+['Reading files','Detecting sheets','Detecting datasets','Mapping columns','Validating data','Processing metrics','Updating dashboard'].map((x,i)=>`<div class="stage" data-stage="${i}">${x}</div>`).join('')+'</div><div class="file-list" id="uiFileList">No files selected.</div>';card.appendChild(proc);const ok=document.createElement('div');ok.id='uiSuccess';ok.className='upload-success';ok.style.display='none';ok.textContent='Data processed successfully';card.appendChild(ok);shell.appendChild(card);main.parentNode.insertBefore(shell,main.nextSibling);upload.remove();const filters=document.querySelector('.filters');if(filters&&!document.getElementById('vendorF')){const v=document.createElement('select');v.id='vendorF';v.innerHTML='<option value="">All Vendors</option>';filters.insertBefore(v,filters.querySelector('button'));}const cf=document.getElementById('customerFile'),lf=document.getElementById('loginFile');function files(){const fs=[cf?.files[0],lf?.files[0]].filter(Boolean);const n=document.getElementById('uiFilesDetected'),list=document.getElementById('uiFileList');if(n)n.textContent=fs.length;if(list)list.innerHTML=fs.length?fs.map(f=>`• ${esc(f.name)} <span class="mini">(${Math.round(f.size/1024)} KB)</span>`).join('<br>'):'No files selected.'}cf?.addEventListener('change',files);lf?.addEventListener('change',files);const oldUpload=window.uploadFiles;window.uploadFiles=async function(){files();document.getElementById('uiDataStatus').textContent='Processing';document.getElementById('uiSuccess').style.display='none';const st=[...document.querySelectorAll('.stage')];st.forEach(x=>x.classList.remove('active','done'));st[0]?.classList.add('active');try{await oldUpload();st.forEach(x=>x.classList.add('done'));st.forEach(x=>x.classList.remove('active'));document.getElementById('uiRows').textContent=((DATA.customer||[]).length+(DATA.login||[]).length).toLocaleString();document.getElementById('uiLastUpload').textContent=new Date().toLocaleString();document.getElementById('uiDataStatus').textContent='Ready';document.getElementById('uiSuccess').style.display='block'}catch(e){document.getElementById('uiDataStatus').textContent='Error';throw e}};window.showDashboard=function(){location.hash='#overview'};window.showUpload=function(){main.classList.add('dashboard-main-hidden');shell.classList.add('active');window.scrollTo(0,0)};window.showOverview=function(){main.classList.remove('dashboard-main-hidden');shell.classList.remove('active');window.scrollTo(0,0)};function route(){location.hash==='#uploadPage'?showUpload():showOverview()}document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>setTimeout(route,0)));window.addEventListener('hashchange',route);route();if(window.populate)window.populate();if(window.render)window.render()}window.addEventListener('load',setup)})();</script>'''
          if 'id="uiux-controller"' not in s: s=s.replace('</body>',controller+'</body>',1)

          s=s.replace('Upload & Process','Upload Files')
          p.write_text(s,encoding='utf-8')

      - name: Commit dashboard fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Move upload to dedicated tab and refine overview UI"
            git push
          fi
