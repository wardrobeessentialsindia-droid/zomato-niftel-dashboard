name: Cleanup legacy UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy dark overrides
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="niftel-branding">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<style id="uiux-overrides">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script id="niftel-ui-patch">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="uiux-controller">.*?</script>', '', s, flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No cleanup needed"; else git commit -m "Remove legacy dashboard UI overrides"; git push; fi
